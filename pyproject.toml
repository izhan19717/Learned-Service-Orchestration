[project]
name = "cisose-deeprm"
version = "0.1.0"
description = "CISOSE learned service orchestration reproducibility package"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "mlflow>=2.14",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scipy>=1.13",
  "torch>=2.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
cisose-deeprm = "cisose_deeprm.cli:main"
cisose-rossi = "cisose_rossi.cli:main"
cisose-decima = "cisose_decima.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/cisose_common",
  "src/cisose_deeprm",
  "src/cisose_decima",
  "src/cisose_rossi",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
