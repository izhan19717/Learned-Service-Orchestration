  <text class="status" x="174.0" y="306" text-anchor="middle" font-size="13">F</text>
  <rect class="amber" x="196" y="288" width="24" height="24" rx="4" />
  <text class="status" x="208.0" y="306" text-anchor="middle" font-size="13">F</text>
  <rect class="green" x="230" y="288" width="24" height="24" rx="4" />
  <text class="status" x="242.0" y="306" text-anchor="middle" font-size="13">C</text>
  <rect class="green" x="264" y="288" width="24" height="24" rx="4" />
  <text class="status" x="276.0" y="306" text-anchor="middle" font-size="13">C</text>
  <rect class="amber" x="298" y="288" width="24" height="24" rx="4" />
  <text class="status" x="310.0" y="306" text-anchor="middle" font-size="13">F</text>
  <rect class="amber" x="332" y="288" width="24" height="24" rx="4" />
  <text class="status" x="344.0" y="306" text-anchor="middle" font-size="13">F</text>
  <rect class="amber" x="366" y="288" width="24" height="24" rx="4" />
  <text class="status" x="378.0" y="306" text-anchor="middle" font-size="13">F</text>

  <rect class="card" x="432" y="120" width="335" height="220" rx="18" />
  <text class="eyebrow" x="466" y="158">COMPARATOR STANDARD</text>
  <text class="big-amber" x="466" y="235">15.6x</text>
